[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tattooptics"
version = "0.1.0"
description = "How tattoo ink in the skin affects wrist PPG heart-rate sensors and pulse oximetry: a white Monte Carlo tissue-optics model"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Abdul Haleem"}]
requires-python = ">=3.9"
dependencies = ["numpy"]
keywords = ["photoplethysmography", "ppg", "pulse-oximetry", "tissue-optics", "monte-carlo", "wearables", "tattoo", "biomedical-engineering"]

[project.optional-dependencies]
examples = ["matplotlib", "pillow"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/hxlvvm/TattooOptics"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
